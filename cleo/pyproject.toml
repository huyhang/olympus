[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cleo"
version = "0.1.0"
description = "A librarian agent for a Nineveh comic and manga library"
readme = "README.md"
# Matches Nineveh, whose CI runs 3.12. Keeping the floor the same means a
# construct that works here cannot fail over there for version reasons.
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "textual>=1,<7",
]

[project.scripts]
cleo = "cleo.app:main"

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cleo"]

[tool.pytest.ini_options]
# The 90% Nineveh holds itself to, now that there is implementation to cover.
# The suite currently sits well above it; the gate is the floor, not the target.
addopts = "-q --cov=cleo --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cleo"]
branch = true
# `python -m cleo` only ever runs in a fresh interpreter, so process-local
# coverage cannot see it. It is four lines that call `main`, which is tested.
omit = ["src/cleo/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

# Deliberately no [tool.ruff]. Nineveh has none either, and ruff's own defaults
# already enable the rule set both repositories are checked against
# (`ruff check` / `ruff format --check`). Adding configuration here would let
# the two drift apart.
