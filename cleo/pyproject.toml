# Cleo's own test configuration. Cleo is not a separate distribution: it ships
# inside `olympus-agents`, the repository-root package, which also registers it
# under the `olympus.agents` entry point. Keeping a second distribution here
# would ship the `cleo` package twice and depend on a name, `olympus`, that on
# PyPI belongs to an unrelated project.
#
# Cleo's floor matches Nineveh, whose CI runs Python 3.12, so a construct that
# works here cannot fail over there for version reasons.

[tool.pytest.ini_options]
# The 90% Nineveh holds itself to, now that there is implementation to cover.
# The suite currently sits well above it; the gate is the floor, not the target.
addopts = "-q --cov=cleo --cov-fail-under=90"
testpaths = ["tests"]
# `scripts` for the fake backends, whose tests keep them honest to the adapters,
# and `../src` for the Olympus contracts Cleo implements, so this suite also
# runs on its own from `cleo/`.
pythonpath = ["src", "scripts", "../src"]

[tool.coverage.run]
source = ["cleo"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

# Deliberately no [tool.ruff]. Nineveh has none either, and ruff's own defaults
# already enable the rule set both repositories are checked against
# (`ruff check` / `ruff format --check`). Adding configuration here would let
# the two drift apart.
